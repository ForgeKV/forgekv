services:
  forgekv:
    build:
      context: ./rust
    ports:
      - "6379:6379"
    volumes:
      - forgekv-data:/data
    environment:
      # Optional zstd compression of string values (see docs/value-compression.md).
      # Defaults keep the previous behaviour (off). Env overrides forgekv.conf.
      # IMPORTANT: every ForgeKV binary that reads this data (replicas, rollback
      # images) must be >= 0.3.0 before you set FORGEKV_VALUE_COMPRESSION=zstd.
      FORGEKV_VALUE_COMPRESSION: ${FORGEKV_VALUE_COMPRESSION:-off}            # off | zstd
      FORGEKV_VALUE_COMPRESSION_LEVEL: ${FORGEKV_VALUE_COMPRESSION_LEVEL:-3}  # zstd level 1-19 (1-3 recommended)
      FORGEKV_VALUE_COMPRESSION_MIN_SIZE: ${FORGEKV_VALUE_COMPRESSION_MIN_SIZE:-512}  # bytes; smaller values stay raw
      # Optional: after startup, compress already-stored values in the background (throttled).
      # Requires FORGEKV_VALUE_COMPRESSION=zstd. Off by default; prefer running FORGEKV.COMPRESS manually.
      FORGEKV_COMPRESS_ON_START: ${FORGEKV_COMPRESS_ON_START:-off}            # on | off
      FORGEKV_COMPRESS_RATE: ${FORGEKV_COMPRESS_RATE:-200}                    # keys/sec for that job (0 = unlimited)
    restart: unless-stopped


volumes:
  forgekv-data:
