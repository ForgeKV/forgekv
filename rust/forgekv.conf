bind 0.0.0.0
port 6379
dir /data
databases 16
# Larger memtables → fewer L0 flushes under CacheHotels write load.
# Effective floor is max(configured/256, 1MB) per shard.
memtable-size-mb 2048

# Blocking-pool size for GET/SET/SCAN (spawn_blocking). StackExchange.Redis
# often uses one connection; this still frees tokio workers for other clients.
io-threads 8
io-threads-do-reads yes
