name: docker-publish

# Builds rust/Dockerfile and publishes multi-arch images.
#   - push of a tag v*   -> :X.Y.Z, :X.Y, :latest
#   - push to main       -> :edge, :sha-<short>   (does NOT move :latest)
#   - manual dispatch    -> :sha-<short>
#
# Registries:
#   * GHCR  (ghcr.io/forgekv/forgekv) - always, uses the built-in GITHUB_TOKEN.
#   * Docker Hub (forgekv/forgekv)    - only when the repo secrets DOCKERHUB_USERNAME
#                                       and DOCKERHUB_TOKEN are set.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/forgekv/forgekv
  HUB_IMAGE: forgekv/forgekv

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: hub
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$U" ] && [ -n "$T" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.hub.outputs.enabled == 'true' && env.HUB_IMAGE || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ./rust
          file: ./rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
